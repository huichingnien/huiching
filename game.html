<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>阿青跑福興｜像素跑酷</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans TC",sans-serif;background:#0a3561;color:white}.shell{height:100dvh;max-width:550px;margin:auto;position:relative;overflow:hidden;background:#73c8f6}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.hud{position:absolute;top:10px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}.stat{background:#123c72e8;border:2px solid #d4ecff;border-radius:7px;box-shadow:3px 3px #082f53;padding:5px 7px;text-align:center;font-size:12px;font-weight:900;min-width:76px}.stat strong{font-size:19px;color:#ffe07b}.actions{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.actions button{pointer-events:auto;background:#0f477dd9;border:3px solid #e6f4ff;color:#fff;border-radius:9px;box-shadow:3px 3px #092c50;font-size:25px;font-weight:900;width:59px;height:55px;touch-action:manipulation}.actions div{display:flex;gap:9px}.help{position:absolute;bottom:76px;width:100%;text-align:center;font-size:12px;font-weight:900;text-shadow:2px 2px #19436a;pointer-events:none}.cover{position:absolute;inset:0;background:#072c54b8;display:flex;align-items:center;justify-content:center;padding:15px}.cover[hidden]{display:none}.panel{max-height:95dvh;overflow:auto;background:#fff9e9;color:#133e71;border:4px solid #174c83;border-radius:13px;box-shadow:7px 7px #072b50;padding:17px;max-width:355px;width:100%;text-align:center}.cover-art{display:block;width:100%;max-height:220px;object-fit:cover;object-position:center 40%;border:3px solid #174c83;border-radius:8px;margin-bottom:8px;image-rendering:auto}.panel h1{margin:0 0 8px;font-size:28px;color:#164c8e;text-shadow:2px 2px #a8d7ff}.panel p{font-size:14px;line-height:1.65;margin:9px 0}.panel button{background:#ffcc53;border:3px solid #164c83;border-radius:8px;padding:9px 22px;color:#153e71;font-size:20px;font-weight:900;cursor:pointer}.panel .rewards{background:#eaf6ff;border:2px dashed #9bc8e9;border-radius:9px;padding:8px 4px;font-size:13px}.pause{position:absolute;right:10px;top:86px;background:#0f477ddd;border:2px solid #d8f0ff;border-radius:8px;color:#fff;font-size:20px;font-weight:900;width:35px;height:34px;cursor:pointer}.back{position:absolute;top:89px;left:10px;background:#ffffffdf;border:2px solid #164c83;border-radius:7px;padding:5px 9px;color:#164c83;font-size:12px;text-decoration:none;font-weight:900}@media(max-height:560px){.help{bottom:60px}.actions{bottom:5px}.actions button{height:44px}.back{top:72px}}</style></head><body>
<div class="shell" id="shell"><canvas id="game" aria-label="阿青跑福興像素無盡奔跑遊戲"></canvas><div class="hud"><div class="stat">🏃 距離<br><strong id="meters">0</strong> m</div><div class="stat">⭐ 道具<br><strong id="bonus">0</strong> 分</div><div class="stat">🏆 最高<br><strong id="record">0</strong> 分</div></div><a class="back" href="index.html">⌂ 回網站</a><button class="pause" id="pause" aria-label="暫停遊戲">Ⅱ</button><div class="help">← → 換道　↑ 跳躍　↓ 滑行｜手機滑動</div><div class="actions"><button data-go="left" aria-label="左移">◀</button><div><button data-go="jump" aria-label="跳躍">▲</button><button data-go="slide" aria-label="滑行">▼</button></div><button data-go="right" aria-label="右移">▶</button></div><div class="cover" id="cover"><div class="panel"><img class="cover-art" src="assets/game-cover.webp" alt="阿青與西高地白梗在福興鄉田園奔跑的像素遊戲封面"><h1 id="title">阿青跑福興 🌾</h1><p id="intro">和阿青、白梗一起奔跑，穿越福興田園！<br>左右閃避汽車、機車和乳牛，跳過坑洞。</p><div class="rewards">💗 愛心 +5　🥛 牛奶 +8<br>🌾 稻穗 +3　🦪 蚵仔 +6</div><p>🌾 農田 × 鄉間道路 × 海岸風情<br>越跑越快，挑戰最高分！</p><button id="start">▶ 開始奔跑</button></div></div></div>
<script>
(()=>{'use strict';const shell=document.getElementById('shell'),canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),cover=document.getElementById('cover'),$=s=>document.getElementById(s);let W=240,H=400,scale=1,paused=false,run=false,lane=1,shownLane=1,dist=0,bonus=0,record=0,spd=22,spawn=0,items=[],jump=0,slide=0,t=0,last=0,blink=0;try{record=+(localStorage.getItem('aq-run-record-v2')||0)}catch{}$('record').textContent=record;
function resize(){let r=shell.getBoundingClientRect();W=240;H=Math.max(310,Math.round(W*r.height/r.width));scale=Math.min(3,devicePixelRatio||1);canvas.width=W*scale;canvas.height=H*scale;ctx.setTransform(scale,0,0,scale,0,0);ctx.imageSmoothingEnabled=false}
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.fill()}
function oval(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill()}
function text(s,x,y,size=11,c='#fff'){ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillStyle=c;ctx.fillText(s,x,y)}
function p(z){return Math.pow(Math.max(0,Math.min(1,1-z/120)),1.55)}
function ry(q){return H*.27+q*H*.77}
function half(q){return 12+q*135}
function lx(q,l){return W/2+(l-1)*half(q)*.62}
function tree(x,y,s){box(x-s*.09,y-s*.12,s*.18,s*.5,'#795436');box(x-s*.5,y-s*.65,s,s*.45,'#257b47');box(x-s*.38,y-s*.86,s*.76,s*.34,'#3b9e56');box(x-s*.24,y-s,s*.48,s*.22,'#54ba6b')}
function scene(){box(0,0,W,H,'#5ab8fa');box(0,H*.08,W,H*.17,'#8ed8ff');box(0,H*.19,W,H*.08,'#b7e5fa');
// Puffy clouds and distant hills
for(let i=0;i<7;i++){let x=((i*59+12-dist*.07)%(W+80)+W+80)%(W+80)-25,y=H*(.045+(i%3)*.045);box(x,y,30,6,'#fff');box(x+5,y-6,18,7,'#fff');box(x+11,y-11,10,5,'#fff')}
for(let i=0;i<9;i++){let x=i*36-16;poly([[x,H*.26],[x+22,H*.19+(i%3)*5],[x+52,H*.26]],i%2?'#69b7a4':'#78c5a4')}
box(0,H*.255,W,H*.03,'#a5d567');
box(0,H*.20,W,H,'#91cf6e');box(0,H*.28,W,H*.72,'#6cba56');
// rice-field bands
for(let i=0;i<16;i++){let q=((i/16+dist*.005)%1),y=ry(q),hh=1+q*6;box(0,y,W,hh,i%2?'#8dd14e':'#aedc63')}
for(let i=0;i<5;i++){let x=((i*69+25)%280)-20;box(x,H*.08+i%2*8,28,6,'#e9f8ff');box(x+5,H*.065+i%2*8,17,8,'#e9f8ff')}box(0,H*.265,W,5,'#60aa59');
for(let i=0;i<12;i++){let q=((i/12+dist*.006)%1),y=ry(q),sz=4+q*33,xoff=half(q)+sz*.7;for(let side of [-1,1]){let x=W/2+side*xoff;box(x-sz*.6,y+sz*.25,sz*1.2,2+q*5,'#b3c766');tree(x,y,sz)}}
poly([[108,H*.27],[132,H*.27],[W+50,H+12],[-50,H+12]],'#a8c576');poly([[109,H*.27],[131,H*.27],[W+10,H+10],[-10,H+10]],'#525e70');
poly([[111,H*.27],[129,H*.27],[W-3,H+10],[3,H+10]],'#657180');
poly([[112,H*.27],[128,H*.27],[W-8,H+10],[8,H+10]],'#687583');
// perspective roadside fence posts
for(let i=0;i<16;i++){let q=((i/16+dist*.009)%1),y=ry(q),hh=3+q*28;for(let side of [-1,1]){let x=W/2+side*(half(q)*.97+4);box(x-2,y-hh,4,hh,'#e8e0c8');box(x-3,y-hh,6,3,'#f8f1dd');box(x-2,y-hh*.62,side*2,3,'#c6bd9f')}}
poly([[111,H*.27],[129,H*.27],[W-3,H+10],[3,H+10]],'#747b82');
for(let i=0;i<14;i++){let q=((i/14+dist*.008)%1),y=ry(q),h=2+q*11;for(let side of [-1,1]){let x=W/2+side*half(q)*.33;box(x-h*.12,y,h*.24,h,'#f9df7b')}}}
function person(x,y,s,pose){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.scale(s,s);const k=Math.sin(t*15)>0?1:-1;box(-7,-27,14,13,'#124c99');box(-5,-25,10,8,'#1d71c6');box(-2,-24,4,5,'#fff');box(-11,-26,4,11,'#ffd0a8');box(7,-26,4,11,'#ffd0a8');if(pose==='slide'){box(-9,-13,19,7,'#144f96');box(6,-16,11,10,'#ffd0a8')}else{box(-6,-14,5,12,'#163a73');box(1,-14,5,12,'#163a73');box(-7+(k*2),-3,7,4,'#f4f6f9');box(2-(k*2),-3,7,4,'#f4f6f9')}box(-8,-43,16,16,'#ffd3ac');box(-10,-47,20,7,'#63402c');box(-10,-43,4,11,'#63402c');box(8,-41,5,12,'#63402c');box(9,-35,7,5,'#63402c');box(-5,-35,2,2,'#2d3338');box(3,-35,2,2,'#2d3338');ctx.restore()}
function car(x,y,s){box(x-s*.43,y-s*.65,s*.86,s*.58,'#c63d3b');box(x-s*.32,y-s*.9,s*.64,s*.37,'#ec5b49');box(x-s*.25,y-s*.83,s*.5,s*.18,'#a7e4f7');box(x-s*.42,y-s*.23,s*.16,s*.15,'#f7e7aa');box(x+s*.26,y-s*.23,s*.16,s*.15,'#f7e7aa');box(x-s*.4,y-s*.08,s*.17,s*.14,'#29313b');box(x+s*.23,y-s*.08,s*.17,s*.14,'#29313b')}
function bike(x,y,s){box(x-s*.17,y-s*.64,s*.34,s*.56,'#0879bf');box(x-s*.24,y-s*.72,s*.48,s*.13,'#253f51');box(x-s*.19,y-s*.43,s*.38,s*.2,'#35b5f0');box(x-s*.14,y-s*.06,s*.28,s*.18,'#1f3146');box(x-s*.24,y-s*.64,s*.09,s*.13,'#b9e8ff');box(x+s*.15,y-s*.64,s*.09,s*.13,'#b9e8ff')}
function cow(x,y,s){box(x-s*.46,y-s*.7,s*.78,s*.49,'#fff6e5');box(x-s*.31,y-s*.66,s*.3,s*.25,'#262b30');box(x+s*.1,y-s*.5,s*.19,s*.23,'#262b30');box(x-s*.48,y-s*.25,s*.13,s*.3,'#f6ede3');box(x+s*.14,y-s*.25,s*.13,s*.3,'#f6ede3');box(x+s*.24,y-s*.68,s*.29,s*.32,'#fff7ea');box(x+s*.28,y-s*.48,s*.23,s*.14,'#f0a2a2');box(x+s*.33,y-s*.63,s*.055,s*.055,'#262b30');box(x+s*.49,y-s*.8,s*.12,s*.13,'#292f32');box(x+s*.22,y-s*.8,s*.12,s*.13,'#292f32')}
function reward(type,x,y,s){if(type==='heart'){for(let a of [-1,1])box(x+a*s*.07-s*.25,y-s*.8,s*.35,s*.32,'#ff86ad');box(x-s*.36,y-s*.61,s*.72,s*.31,'#ed4382');poly([[x-s*.34,y-s*.33],[x+s*.34,y-s*.33],[x,y+s*.05]],'#ed4382');box(x-s*.23,y-s*.73,s*.15,s*.1,'#fff0f5')}
else if(type==='milk'){box(x-s*.26,y-s*.72,s*.52,s*.73,'#fff8e5');box(x-s*.26,y-s*.5,s*.52,s*.25,'#2d8fd4');box(x-s*.16,y-s*.87,s*.32,s*.16,'#e4f5ff');box(x-s*.16,y-s*.78,s*.32,s*.08,'#1764b7');text('乳',x,y-s*.28,Math.max(5,s*.21),'#fff')}
else if(type==='rice'){for(let i=0;i<6;i++){let yy=y-s*.8+i*s*.13;box(x-s*.03+i*s*.018,yy,s*.1,s*.16,'#ffe079');box(x-s*.16+i*s*.018,yy+s*.045,s*.1,s*.13,'#e7ac24')}box(x+s*.07,y-s*.85,s*.045,s*.9,'#9c7b25')}
else if(type==='oyster'){oval(x,y-s*.42,s*.37,s*.3,'#534b48');oval(x,y-s*.44,s*.3,s*.23,'#e7d8b8');oval(x,y-s*.45,s*.2,s*.15,'#fff6d7');oval(x,y-s*.45,s*.11,s*.09,'#b8aa92')}}
function objects(){for(const o of [...items].sort((a,b)=>b.z-a.z)){let q=p(o.z);if(q<.007)continue;let x=lx(q,o.lane),y=ry(q),s=5+q*63;oval(x,y,s*.42,s*.10,'#34404877');if(o.type==='car')car(x,y,s);else if(o.type==='bike')bike(x,y,s);else if(o.type==='cow')cow(x,y,s);else if(o.type==='hole'){oval(x,y,s*.53,s*.27,'#34353a');oval(x,y,s*.37,s*.16,'#101922');box(x-s*.55,y-s*.1,s*.16,s*.06,'#a6a8a5')}else reward(o.type,x,y-s*.14,s*.75)}}
function dog(x,y){ctx.save();ctx.translate(Math.round(x),Math.round(y));let bob=Math.sin(t*16)*2;box(-8,-17+bob,15,11,'#fff6e9');box(4,-22+bob,10,11,'#fff6e9');box(5,-27+bob,4,7,'#fff6e9');box(12,-27+bob,4,7,'#fff6e9');box(8,-17+bob,2,2,'#253448');box(12,-15+bob,3,2,'#253448');box(-7,-7+bob,4,7,'#f5eee4');box(2,-7+bob,4,7,'#f5eee4');box(-12,-17+bob,5,4,'#fff6e9');box(-4,-15+bob,10,4,'#4f8cd3');ctx.restore()}
function draw(){scene();objects();let x=lx(.95,shownLane),y=ry(.95),h=jump>0?Math.sin((.76-jump)/.76*Math.PI)*H*.17:0;oval(x,y,12,3,'#263b4577');person(x,y-h,1.2,slide>0?'slide':'run');dog(x+29,y+4);if(blink>0){box(0,0,W,H,'#fff2b544')}}
function refresh(){$('meters').textContent=Math.floor(dist);$('bonus').textContent=bonus;$('record').textContent=record}
function reset(){paused=false;$('pause').textContent='Ⅱ';run=true;lane=1;shownLane=1;dist=0;bonus=0;spd=22;spawn=.3;items=[];jump=0;slide=0;t=0;blink=0;cover.hidden=true;refresh()}
function end(){if(!run)return;run=false;paused=false;let score=Math.floor(dist)+bonus;if(score>record){record=score;try{localStorage.setItem('aq-run-record-v2',record)}catch{}}refresh();$('title').textContent='挑戰結束！';$('intro').innerHTML=`跑了 <b>${Math.floor(dist)} 公尺</b><br>道具加分 <b>${bonus}</b>，總分 <b>${score}</b>！`; $('start').textContent='↻ 再挑戰一次';cover.hidden=false}
function act(a){if(!run||paused)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=0)jump=.76;if(a==='slide'&&slide<=0&&jump<=0)slide=.65}
function add(){let l=Math.floor(Math.random()*3),type=['car','bike','hole','cow'][Math.floor(Math.random()*4)];items.push({lane:l,z:120,type,done:false});let other=[0,1,2].filter(i=>i!==l),rl=other[Math.floor(Math.random()*other.length)],rewardType=['heart','milk','rice','oyster'][Math.floor(Math.random()*4)];items.push({lane:rl,z:133,type:rewardType,done:false})}
function step(dt){if(!run||paused)return;t+=dt;dist+=spd*dt*.48;spd=Math.min(52,22+dist/95);spawn-=dt;if(spawn<=0){add();spawn=Math.max(.7,1.48-dist/850)}shownLane+=(lane-shownLane)*Math.min(1,dt*13);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);blink=Math.max(0,blink-dt);for(let o of items){o.z-=spd*dt;if(o.z<10&&!o.done){o.done=true;if(o.lane===lane){if(['heart','milk','rice','oyster'].includes(o.type)){bonus+=({heart:5,milk:8,rice:3,oyster:6})[o.type];blink=.13}else if(o.type==='hole'){if(jump<.12)end()}else end()}}}items=items.filter(o=>o.z>-10);refresh()}
function frame(now){let dt=Math.min(.05,(now-last)/1000||0);last=now;step(dt);draw();requestAnimationFrame(frame)}
$('start').onclick=reset;
$('pause').onclick=()=>{if(!run)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'繼續遊戲':'暫停遊戲')};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>act(b.dataset.go));document.addEventListener('keydown',e=>{let a=({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'slide',a:'left',d:'right',w:'jump',s:'slide',' ':'jump'})[e.key];if(a){e.preventDefault();act(a)}});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<16)return;act(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide')},{passive:true});window.addEventListener('resize',resize);resize();last=performance.now();requestAnimationFrame(frame);
})();
</script></body></html>
