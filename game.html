<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092f43"><meta name="description" content="和阿青、白狗穿越福興田園與海岸，閃避障礙、收集在地好物的像素跑酷遊戲。"><title>阿青跑福興｜田園海岸跑酷</title><link rel="stylesheet" href="game.css"></head>

 <section class="veil" id="menu" role="dialog" aria-modal="true" aria-labelledby="menu-title"><div class="menu-card">

 </div></section>
