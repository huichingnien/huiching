<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>阿青跑福興｜無盡奔跑</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Noto Sans TC",sans-serif;background:#102f56;color:#fff}.app{height:100dvh;max-width:530px;margin:auto;position:relative;overflow:hidden;background:#8bcfee}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}.stat{background:#123c6de8;border:2px solid #fff9;border-radius:12px;padding:7px 9px;font-weight:900;font-size:13px;text-align:center;text-shadow:1px 2px #123}.stat b{font-size:19px;color:#ffe48e}.ctrl{position:absolute;bottom:16px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.ctrl button{pointer-events:auto;border:2px solid #fff9;background:#113f77c9;color:white;border-radius:15px;font-size:25px;font-weight:900;width:61px;height:58px;touch-action:manipulation}.ctrl .middle{display:flex;gap:8px}.overlay{position:absolute;inset:0;background:#082444b9;display:flex;align-items:center;justify-content:center;padding:18px}.overlay[hidden]{display:none}.panel{width:100%;max-width:355px;background:#fff8e8;color:#154372;border:4px solid #173d6d;border-radius:20px;box-shadow:7px 8px #092d52;padding:20px;text-align:center}.panel h1{font-size:27px;margin:0 0 8px}.panel p{line-height:1.65;margin:9px 0}.panel button{border:3px solid #16416f;border-radius:12px;background:#ffcf79;color:#123e6d;font-size:20px;font-weight:900;padding:10px 22px;margin-top:8px}.tip{position:absolute;bottom:85px;width:100%;text-align:center;font-weight:800;text-shadow:1px 2px #143;font-size:13px;pointer-events:none}@media(max-height:530px){.ctrl{bottom:6px}.ctrl button{height:44px}.tip{bottom:55px}.hud{top:5px}}</style></head><body><main class="app" id="app"><canvas id="canvas" aria-label="三跑道透視視角無盡奔跑遊戲"></canvas><div class="hud"><div class="stat">🏃 距離<br><b id="distance">0</b> m</div><div class="stat">🌾 獎勵<br><b id="coins">0</b></div><div class="stat">🏆 最高<br><b id="best">0</b></div></div><div class="tip">← → 換道　↑ 跳躍　↓ 滑行｜手機可滑動</div><div class="ctrl"><button data-action="left" aria-label="向左換道">◀</button><div class="middle"><button data-action="jump" aria-label="跳躍">⬆</button><button data-action="slide" aria-label="滑行">⬇</button></div><button data-action="right" aria-label="向右換道">▶</button></div><div class="overlay" id="overlay"><div class="panel"><h1 id="heading">🌾 阿青跑福興</h1><p id="message">Temple Run 風格的三跑道無盡奔跑！<br>穿越福興農田，閃避汽機車、坑洞和乳牛。</p><p>💗 愛心 +5　🥛 牛奶 +8　🌾 稻穗 +3</p><p>左右換道、向上跳躍、向下滑行<br>速度會越跑越快！</p><button id="start">開始奔跑 ▶</button></div></div></main>
<script>
(()=>{'use strict';
const app=document.getElementById('app'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const $=id=>document.getElementById(id);let W=400,H=700,dpr=1,playing=false,last=0,distance=0,bonus=0,best=0,speed=18,spawnTimer=0,objects=[],lane=1,visualLane=1,jump=0,slide=0,clock=0,flash=0;
try{best=Number(localStorage.getItem('aq-temple-best')||0)}catch{}$('best').textContent=best;
function resize(){const r=app.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function poly(pts,color){ctx.fillStyle=color;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function label(t,x,y,size=24){ctx.font=`${size}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,x,y)}
function perspective(z){let q=Math.max(0,Math.min(1,1-z/105));return Math.pow(q,1.65)}
function roadY(p){return H*.32+(H*.69)*p}
function roadHalf(p){return W*(.08+.52*p)}
function roadX(p,l){return W/2+(l-1)*roadHalf(p)*.64}
function updateHud(){$('distance').textContent=Math.floor(distance);$('coins').textContent=bonus;$('best').textContent=best}
function reset(){distance=0;bonus=0;speed=18;spawnTimer=0;objects=[];lane=1;visualLane=1;jump=0;slide=0;clock=0;flash=0;playing=true;overlay.hidden=true;last=performance.now();updateHud()}
function finish(){if(!playing)return;playing=false;let total=Math.floor(distance)+bonus;if(total>best){best=total;try{localStorage.setItem('aq-temple-best',String(best))}catch{}}updateHud();$('heading').textContent='💥 阿青撞到障礙了！';$('message').innerHTML=`跑了 <b>${Math.floor(distance)} 公尺</b>，收集 <b>${bonus} 分</b><br>本次總分 <b>${total}</b>！`; $('start').textContent='再跑一次 ↻';overlay.hidden=false}
function act(a){if(!playing)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=0&&slide<=0)jump=.85;if(a==='slide'&&slide<=0&&jump<=0)slide=.8}
function spawn(){let l=Math.floor(Math.random()*3),kind=Math.random(),type=kind<.30?'car':kind<.51?'bike':kind<.73?'hole':kind<.91?'cow':'gate';objects.push({lane:l,z:105,type,hit:false});let safe=[0,1,2].filter(i=>i!==l);let reward=['heart','milk','rice'][Math.floor(Math.random()*3)];objects.push({lane:safe[Math.floor(Math.random()*safe.length)],z:112,type:reward,hit:false})}
function tick(dt){if(!playing)return;clock+=dt;distance+=speed*dt*.5;speed=Math.min(45,18+distance/100);spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=Math.max(.67,1.4-distance/1000)}visualLane+=(lane-visualLane)*Math.min(1,dt*12);jump=Math.max(0,jump-dt);slide=Math.max(0,slide-dt);flash=Math.max(0,flash-dt);
for(const o of objects){o.z-=speed*dt;if(o.z<8&&!o.hit){o.hit=true;if(o.lane===lane){if(['heart','milk','rice'].includes(o.type)){bonus+({heart:5,milk:8,rice:3}[o.type]);flash=.22}else if(o.type==='hole'){if(jump<=.12)finish()}else if(o.type==='gate'){if(slide<=.1)finish()}else if(o.type==='cow'||o.type==='car'||o.type==='bike'){finish()}}}}objects=objects.filter(o=>o.z>-12);updateHud()}
function draw(){const horizon=H*.32;rect(0,0,W,H,'#90d8f4');rect(0,horizon-30,W,H-horizon+30,'#85c867');
ellipse(W*.16,horizon-95,34,25,'#fff5b0');for(let i=0;i<5;i++){let x=(i*123+40)%W;ellipse(x,horizon-45,42,13,'#61aa61');ellipse(x+20,horizon-57,28,16,'#58a454')}
const bottom=H*1.02;poly([[W*.42,horizon],[W*.58,horizon],[W*1.04,bottom],[-W*.04,bottom]],'#6d727b');
poly([[W*.42,horizon],[W*.43,horizon],[W*.0,bottom],[-W*.12,bottom]],'#d1b78b');poly([[W*.57,horizon],[W*.58,horizon],[W*1.12,bottom],[W,bottom]],'#d1b78b');
for(let i=0;i<13;i++){let p=((i/13+distance*.008)%1);let y=roadY(p),half=roadHalf(p);let thick=2+8*p;for(let side of [-1,1]){let x=W/2+side*half*.33;rect(x-thick/2,y,thick,10+25*p,'#f9e8a6')}}
for(let i=0;i<11;i++){let p=(i/11+distance*.006)%1;let y=roadY(p),size=8+33*p;for(const s of [-1,1]){let x=W/2+s*(roadHalf(p)+size*.5);rect(x-size*.13,y-size*.4,size*.26,size*.65,'#855b40');ellipse(x,y-size*.6,size*.5,size*.45,'#3f9552');ellipse(x-size*.18,y-size*.78,size*.32,size*.35,'#50b364');if(i%3===0){rect(x-size*.65,y-size*.2,size*.22,size*.33,'#e7dcb5')}}}
for(const o of [...objects].sort((a,b)=>b.z-a.z)){let p=perspective(o.z);if(p<=.005)continue;let y=roadY(p),x=roadX(p,o.lane),s=12+75*p;ellipse(x,y+3,s*.5,s*.14,'#35424877');
if(o.type==='car'||o.type==='bike'){let w=s*(o.type==='bike'?.5:1),h=s*(o.type==='bike'?.85:.65);rect(x-w/2,y-h,w,h,o.type==='bike'?'#f8b847':'#ef6b61');rect(x-w*.31,y-h*.8,w*.62,h*.33,'#b4eaff');rect(x-w*.45,y-h*.1,w*.19,h*.3,'#263847');rect(x+w*.26,y-h*.1,w*.19,h*.3,'#263847')}
else if(o.type==='hole'){ellipse(x,y,s*.62,s*.27,'#3c3d3e');ellipse(x,y,s*.4,s*.15,'#171d25')}
else if(o.type==='cow')label('🐄',x,y-s*.5,s*.95);
else if(o.type==='gate'){rect(x-s*.5,y-s*1.2,s*.16,s*1.2,'#98573d');rect(x+s*.34,y-s*1.2,s*.16,s*1.2,'#98573d');rect(x-s*.5,y-s*1.2,s,s*.25,'#eaa56b')}
else label(({heart:'💗',milk:'🥛',rice:'🌾'})[o.type],x,y-s*.7,s*.72)}
const px=roadX(.96,visualLane),py=roadY(.96),jumpHeight=jump>0?Math.sin((.85-jump)/.85*Math.PI)*H*.17:0;ellipse(px,py,28,9,'#243a4c77');ctx.save();ctx.translate(px,py-jumpHeight);let sc=Math.max(.75,Math.min(1.25,W/400));ctx.scale(sc,sc);if(slide>0){ellipse(0,-17,25,15,'#173c77');ellipse(13,-24,14,13,'#f8c5a2');rect(-19,-19,35,8,'#173c77')}else{let swing=Math.sin(clock*16)*7;rect(-18,-37,15,33,'#193b75');rect(4,-37,15,33,'#193b75');rect(-17+swing,-7,12,10,'#1d2b49');rect(7-swing,-7,12,10,'#1d2b49');rect(-21,-76,42,43,'#1b4c8a');rect(-29,-70,10,30,'#f8c5a2');rect(19,-70,10,30,'#f8c5a2');rect(-17,-102,34,30,'#f8c5a2');rect(-20,-109,40,13,'#553a31');rect(14,-98,11,27,'#50392d');rect(-9,-89,4,4,'#26384c');rect(7,-89,4,4,'#26384c');ctx.fillStyle='#fff';ctx.font='bold 21px system-ui';ctx.textAlign='center';ctx.fillText('青',0,-47)}ctx.restore();if(flash>0){ctx.fillStyle='#fff5ab44';ctx.fillRect(0,0,W,H)}}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;tick(dt);draw();requestAnimationFrame(frame)}
$('start').addEventListener('click',reset);document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));document.addEventListener('keydown',e=>{let a=({ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'slide',a:'left',d:'right',w:'jump',s:'slide',' ':'jump'})[e.key];if(a){e.preventDefault();act(a)}});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;act(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide')},{passive:true});window.addEventListener('resize',resize);resize();last=performance.now();requestAnimationFrame(frame);
})();
</script></body></html>
