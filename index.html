<script>
const pages={events:{title:'🎮 阿青跑福興',html:''},about:{title:'👩🏻‍💼 認識惠青',html:`<img class="profile-card-img" src="profile-card-v2.png" alt="粘惠青 8-bit 人物資料卡，介紹教育學碩士學歷、公共服務經歷、服務理念，並有福興鄉乳牛及稻田風景" loading="eager"><div class="profile-accessible"><h3>大家好，我是粘惠青！</h3><p>彰化縣福興鄉的鄉民代表，你可以叫我阿青！</p><p>我相信，地方服務就是從生活中的每一件小事開始。無論是道路改善、農田排水，還是長輩關懷與親子教育，都是我持續關心的議題。</p><h3>學歷</h3><ul><li>國立彰化師範大學 教育學碩士</li><li>大葉大學 分子生物科技學系</li><li>正德高中</li><li>精誠中學</li><li>鹿港國小</li></ul><h3>經歷</h3><ul><li>彰化縣福興鄉第22屆鄉民代表</li><li>中國國民黨第21、22屆全國黨代表</li><li>彰化縣政府第2、3屆青年諮詢委員</li><li>彰化縣議會議政顧問</li><li>彰化縣青年農民聯誼會顧問</li><li>鹿港青年商會副會長</li></ul><h3>我的服務理念</h3><p>每一次會勘、每一件陳情、每一項提案，都是讓地方進步的機會。</p><p>我希望透過實際行動，讓福興的生活環境更安全、公共服務更便利，也讓青年、長輩與每一個家庭的需求都能被看見。</p><p>青年行動力，我是粘惠青！</p></div>`},works:{title:'🚧 服務成果',html:`<h3>惠青的服務成果</h3><p class="gallery-intro">地方建設、教育與親子活動，透過一張張圖卡記錄服務足跡。</p><section class="highlights" aria-label="三項重點政績"><article class="highlight"><span class="highlight-icon" aria-hidden="true">🛣️</span><h4>道路改善</h4><p>爭取經費約</p><p class="amount"><strong>4,397</strong> 萬元</p></article><article class="highlight"><span class="highlight-icon" aria-hidden="true">👵👴</span><h4>敬老加碼</h4><p>爭取禮金提高至</p><p class="amount"><strong>1,000</strong> 元</p></article><article class="highlight"><span class="highlight-icon" aria-hidden="true">🥛</span><h4>幼兒照顧</h4><p>爭取鄉立幼兒園<br>免費牛乳加碼為</p><p class="amount">每週 <strong>2</strong> 次</p></article></section><div class="achievement-grid"><a class="achievement-link" href="assets/achievements/achievement-01.webp" target="_blank" rel="noopener" aria-label="開啟第 1 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-01.webp" alt="服務成果圖卡 1" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-02.webp" target="_blank" rel="noopener" aria-label="開啟第 2 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-02.webp" alt="服務成果圖卡 2" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-03.webp" const overlay=document.getElementById('overlay'),modal=document.querySelector('.modal'),title=document.getElementById('modal-title'),body=document.getElementById('modal-body');let lastFocus=null;
function openPage(page){hideTalk();if(page==='events'){window.location.href='game.html';return}if(page==='home'){setMenu(false);closePage();scrollTo({top:0,behavior:'smooth'});return}const data=pages[page];if(!data)return;if(overlay.hidden)lastFocus=document.activeElement;title.textContent=data.title;document.querySelector('.modal-head').append(document.getElementById('close'));body.innerHTML=data.html;modal.classList.toggle('profile-mode',page==='about');modal.classList.toggle('info-mode',['contact','donation'].includes(page));const closeBtn=document.getElementById('close');closeBtn.classList.toggle('info-close',['contact','donation'].includes(page));closeBtn.classList.toggle('profile-close',page==='about');if(page==='about'||page==='contact'||page==='donation'){modal.append(closeBtn);closeBtn.textContent='✕'}else{document.querySelector('.modal-head').append(closeBtn);closeBtn.textContent='✕'}modal.scrollTop=0;overlay.hidden=false;document.getElementById('home-art').inert=true;document.body.style.overflow='hidden';document.getElementById('close').focus();setMenu(false)}
body.addEventListener('click',e=>{const button=e.target.closest('[data-inner-page]');if(button)openPage(button.dataset.innerPage)});
function closePage(){overlay.hidden=true;document.getElementById('home-art').inert=false;document.body.style.overflow='';lastFocus?.focus()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('close').addEventListener('click',closePage);overlay.addEventListener('click',e=>{if(e.target===overlay)closePage()});function setMenu(open){const menu=document.getElementById('menu');document.getElementById('mobile-nav').hidden=!open;menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'收起選單':'展開選單')}
document.getElementById('menu').addEventListener('click',()=>setMenu(document.getElementById('mobile-nav').hidden));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.getElementById('scene-talk').hidden){hideTalk(true);return}if(!overlay.hidden)closePage();else{setMenu(false);document.getElementById('menu').focus()}}if(e.key==='Tab'&&!overlay.hidden){const list=[...modal.querySelectorAll('button,a[href]')].filter(el=>el.getClientRects().length);const first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{if(!e.target.closest('#mobile-nav,#menu'))setMenu(false)});
matchMedia('(max-width:760px)').addEventListener('change',()=>setMenu(false));

const talkBox=document.getElementById('scene-talk'),talkVisual=document.getElementById('talk-visual'),talkStatus=document.getElementById('talk-status');
let talkTimer=0,talkTarget=null;const talkCounts={person:0,dog:0};
const talkLines={person:['歡迎來到阿青的雲端競選總部！','大家好！我是阿青，一起努力！','點選下方選單，看看更多阿青的資訊！','謝謝你來找阿青！♥'],dog:['汪汪！很高興見到你！','謝謝你陪我玩！🐾']};
function hideTalk(restore=false){clearInterval(talkTimer);talkBox.hidden=true;talkStatus.textContent='';document.querySelectorAll('.scene-talk-trigger').forEach(el=>el.setAttribute('aria-expanded','false'));if(restore)talkTarget?.focus()}
function showTalk(kind){clearInterval(talkTimer);talkTarget=document.getElementById('talk-'+kind);document.querySelectorAll('.scene-talk-trigger').forEach(el=>el.setAttribute('aria-expanded',String(el===talkTarget)));const text=talkLines[kind][talkCounts[kind]++%talkLines[kind].length];talkBox.dataset.speaker=kind;talkBox.hidden=false;talkBox.dataset.typing='true';talkStatus.textContent=text;talkVisual.textContent='';if(matchMedia('(prefers-reduced-motion:reduce)').matches){talkVisual.textContent=text;talkBox.dataset.typing='false';return}const chars=Array.from(text);let i=0;talkTimer=setInterval(()=>{talkVisual.textContent=chars.slice(0,++i).join('');if(i===chars.length){clearInterval(talkTimer);talkBox.dataset.typing='false'}},42)}
function advanceTalk(){if(talkBox.dataset.typing==='true'){clearInterval(talkTimer);talkVisual.textContent=talkStatus.textContent;talkBox.dataset.typing='false'}else showTalk(talkBox.dataset.speaker||'person')}
talkBox.addEventListener('click',advanceTalk);
talkBox.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advanceTalk()}});
document.getElementById('talk-person').addEventListener('click',()=>showTalk('person'));
document.getElementById('talk-dog').addEventListener('click',()=>showTalk('dog'));

document.addEventListener('click',e=>{if(!e.target.closest('.scene-talk,.scene-talk-trigger'))hideTalk()});
showTalk('person');
</script>
</body></html>
