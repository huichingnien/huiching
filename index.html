<style>

blue{background:#d8eeff}.cream{background:#fff1d8}.mint{background:#dcfaf2}.foot{text-align:center;padding:20px 12px 32px;color:#426387;font-size:13px}.overlay{position:fixed;inset:0;background:#092849ba;display:grid;place-items:center;padding:18px;z-index:5}.overlay[hidden]{display:none}.modal{background:var(--paper);border:4px solid #184b80;border-radius:15px;box-shadow:8px 8px 0 #072c53;max-width:570px;width:100%;max-height:85vh;overflow:auto}.modal-head{background:#184b80;color:white;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;font-size:22px;font-weight:900}.close{border:2px solid white;border-radius:8px;background:#fff;color:#184b80;font-weight:900;width:38px;height:38px}.modal-body{padding:24px;font-size:16px;line-height:1.85}.modal-body h3{margin:12px 0 6px}.modal-body p{margin:8px 0 14px}.modal-body ul{padding-left:24px}.pill{display:inline-block;background:#e6f2ff;border:1px solid #a6c8e9;border-radius:99px;padding:4px 12px;margin:4px}.note{font-size:13px;color:#667a91}.contact{display:inline-block;background:#184b80;color:white;text-decoration:none;padding:8px 15px;border-radius:8px;margin-top:8px}.dog-trigger{position:absolute;left:11%;bottom:5%;width:24%;height:31%;background:transparent;border:0}.dog-trigger:focus-visible{outline:4px solid #ff8aa8;outline-offset:-4px}.modal.profile-mode{max-width:1100px;background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible;max-height:92vh}.profile-mode .modal-head{display:none}.profile-mode .modal-body{padding:0;max-height:92vh;overflow:auto;border-radius:12px;position:relative}.profile-card-img{display:block;width:100%;height:auto}.profile-close{position:sticky;display:block;z-index:2;bottom:0;margin:8px auto 0;width:auto;height:auto;padding:10px 24px;background:#fff;color:#123e73;border:2px solid #123e73;border-radius:8px;font-size:16px;font-weight:900}.profile-mobile-note{display:none}.profile-accessible{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.mobile-nav{display:none}@media(max-width:760px){.modal.profile-mode{width:100%;max-height:90vh}.profile-mode .modal-body{max-height:88vh}.profile-card-img{width:760px;max-width:none}.profile-mobile-note{display:block;text-align:center;font-size:12px;background:#fff7e9;padding:7px;color:#123e73}.profile-close{margin:8px auto 0;width:auto;height:auto}.site-header{min-height:76px;padding:10px 14px}.brand{gap:10px}.brand-name{font-size:27px}.brand-sub{font-size:11px}.nav{display:none}.menu-button{display:block}.mobile-nav{background:#17497d;padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.mobile-nav[hidden]{display:none}.mobile-nav button{padding:10px;color:#fff;background:#246096;border:1px solid #8bb9e6;border-radius:7px;font-weight:700}.scene img{width:100%}.dog-tip{left:8%;bottom:10%;font-size:11px;padding:5px}.quick{grid-template-columns:repeat(2,1fr);gap:11px;padding:16px 13px 24px}.tile{min-height:95px;padding:12px 5px;flex-direction:column;gap:5px;font-size:17px}.tile .emoji{font-size:25px}.dog-trigger{left:4%;width:29%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>

<body>
<header class="site-header"><div class="brand"><div class="brand-name">粘惠青<span> ♥</span></div><div class="brand-sub">彰化縣福興鄉民代表<br>HUI CHING</div></div><nav class="nav" aria-label="主選單"><button data-page="home">首頁</button><button data-page="about">認識惠青</button><button data-page="works">服務成果</button><button data-page="events">活動訊息</button><button data-page="contact">聯絡我</button></nav><button class="menu-button" id="menu" aria-label="展開選單" aria-expanded="false">☰</button></header>
<nav class="mobile-nav" id="mobile-nav" aria-label="手機選單" hidden><button data-page="about">認識惠青</button><button data-page="works">服務成果</button><button data-page="events">活動訊息</button><button data-page="contact">聯絡我</button></nav>
<main><section class="scene" aria-label="8-bit 像素風福興服務處"><picture><source media="(max-width:760px)" srcset="assets/office-mobile.webp"><img src="assets/office-desktop.webp" alt="像素風格的粘惠青坐在服務處辦公桌前，旁邊有一隻西高地白梗，窗外是福興鄉風景"></picture><button class="dog-trigger" id="dog" aria-label="和西高地白梗打招呼"></button><div class="dog-tip" id="dog-tip" hidden>汪！歡迎來福興 🐾</div></section><section class="quick" aria-label="網站主要功能"><button class="tile pink" data-page="about"><span class="emoji">👩🏻‍💼</span>認識惠青 →</button><button class="tile blue" data-page="works"><span class="emoji">🚧</span>服務成果 →</button><button class="tile cream" data-page="events"><span class="emoji">🗓️</span>活動訊息 →</button><button class="tile mint" data-page="contact"><span class="emoji">📞</span>聯絡我 →</button></section></main><footer class="foot">粘惠青｜彰化縣福興鄉民代表 · 8-bit 互動服務處（展示版）</footer>
<div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><span id="modal-title"></span><button class="close" id="close" aria-label="關閉視窗">✕</button></div><div class="modal-body" id="modal-body"></div></section></div>
<script>
const pages={about:{title:'👩🏻‍💼 認識惠青',html:`<div class="profile-mobile-note">📱 可左右滑動查看完整人物資料卡</div><img class="profile-card-img" src="assets/profile-card.webp" alt="粘惠青 8-bit 人物資料卡，介紹教育學碩士學歷、公共服務經歷、服務理念，並有福興鄉乳牛及稻田風景" loading="eager"><div class="profile-accessible"><h3>大家好，我是粘惠青！</h3><p>彰化縣福興鄉的鄉民代表，你可以叫我阿青！</p><p>我相信，地方服務就是從生活中的每一件小事開始。無論是道路改善、農田排水，還是長輩關懷與親子教育，都是我持續關心的議題。</p><h3>學歷</h3><ul><li>國立彰化師範大學 教育學碩士</li><li>大葉大學 分子生物科技學系</li><li>正德高中</li><li>精誠中學</li><li>鹿港國小</li></ul><h3>經歷</h3><ul><li>彰化縣福興鄉第22屆鄉民代表</li><li>中國國民黨第21、22屆全國黨代表</li><li>彰化縣政府第2、3屆青年諮詢委員</li><li>彰化縣議會議政顧問</li><li>彰化縣青年農民聯誼會顧問</li><li>鹿港青年商會副會長</li></ul><h3>我的服務理念</h3><p>每一次會勘、每一件陳情、每一項提案，都是讓地方進步的機會。</p><p>我希望透過實際行動，讓福興的生活環境更安全、公共服務更便利，也讓青年、長輩與每一個家庭的需求都能被看見。</p><p>青年行動力，我是粘惠青！</p></div>`},works:{title:'🚧 服務成果',html:`<h3>讓改變看得見</h3><ul><li><b>道路改善：</b>關注路面品質及通行安全。</li><li><b>排水建設：</b>協調農田排水及地方水路改善。</li><li><b>環境衛生：</b>關注垃圾清運及登革熱防治。</li><li><b>教育與親子：</b>推廣親子參與及體驗活動。</li></ul><p class="note">此為分類展示，個別案件的成果、照片與辦理進度需核對後上架。</p>`},events:{title:'🗓️ 活動訊息',html:`<h3>近期活動與地方公告</h3><p>📌 光復節連假垃圾清運資訊</p><p>📌 地方道路與排水會勘消息</p><p>📌 社區及親子活動公告</p><p class="note">展示項目，正式發布前將更新日期、內容及相關連結。</p>`},contact:{title:'📞 聯絡我',html:`<h3>有需要，歡迎聯絡惠青</h3><p>地方建設建議、民眾服務及活動合作，都歡迎透過正式聯絡管道反映。</p><p>Facebook 粉絲專頁、LINE 與服務電話將在取得正確資訊後加入。</p><p class="note">目前為網站測試版，尚未開放線上留言或蒐集個人資料。</p>`}};
const overlay=document.getElementById('overlay'),modal=document.querySelector('.modal'),title=document.getElementById('modal-title'),body=document.getElementById('modal-body');let lastFocus=null;
function openPage(page){if(page==='home'){closePage();scrollTo({top:0,behavior:'smooth'});return}const data=pages[page];if(!data)return;lastFocus=document.activeElement;title.textContent=data.title;body.innerHTML=data.html;modal.classList.toggle('profile-mode',page==='about');document.getElementById('close').classList.toggle('profile-close',page==='about');if(page==='about'){body.append(document.getElementById('close'));document.getElementById('close').textContent='← 返回首頁'}else{document.querySelector('.modal-head').append(document.getElementById('close'));document.getElementById('close').textContent='✕'}overlay.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus();document.getElementById('mobile-nav').hidden=true;document.getElementById('menu').setAttribute('aria-expanded','false')}
function closePage(){overlay.hidden=true;document.body.style.overflow='';lastFocus?.focus()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('close').addEventListener('click',closePage);overlay.addEventListener('click',e=>{if(e.target===overlay)closePage()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closePage()});document.getElementById('menu').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav');nav.hidden=!nav.hidden;document.getElementById('menu').setAttribute('aria-expanded',String(!nav.hidden))});document.getElementById('dog').addEventListener('click',()=>{const tip=document.getElementById('dog-tip');tip.hidden=!tip.hidden});
</script>
</body></html>
