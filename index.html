const pages={events:{title:'🎮 阿青跑福興',html:`<h3>遊戲準備中</h3><p>阿青跑福興即將回來，敬請期待！</p>`},about:{title:'👩🏻‍💼 認識惠青',html:`<div class="profile-mobile-note">📱 可左右滑動查看完整人物資料卡</div><img class="profile-card-img" src="assets/profile-card.webp" alt="粘惠青 8-bit 人物資料卡，介紹教育學碩士學歷、公共服務經歷、服務理念，並有福興鄉乳牛及稻田風景" loading="eager"><div class="profile-accessible"><h3>大家好，我是粘惠青！</h3><p>彰化縣福興鄉的鄉民代表，你可以叫我阿青！</p><p>我相信，地方服務就是從生活中的每一件小事開始。無論是道路改善、農田排水，還是長輩關懷與親子教育，都是我持續關心的議題。</p><h3>學歷</h3><ul><li>國立彰化師範大學 教育學碩士</li><li>大葉大學 分子生物科技學系</li><li>正德高中</li><li>精誠中學</li><li>鹿港國小</li></ul><h3>經歷</h3><ul><li>彰化縣福興鄉第22屆鄉民代表</li><li>中國國民黨第21、22屆全國黨代表</li><li>彰化縣政府第2、3屆青年諮詢委員</li><li>彰化縣議會議政顧問</li><li>彰化縣青年農民聯誼會顧問</li><li>鹿港青年商會副會長</li></ul><h3>我的服務理念</h3><p>每一次會勘、每一件陳情、每一項提案，都是讓地方進步的機會。</p><p>我希望透過實際行動，讓福興的生活環境更安全、公共服務更便利，也讓青年、長輩與每一個家庭的需求都能被看見。</p><p>青年行動力，我是粘惠青！</p></div>`},works:{title:'🚧 服務成果',html:`<h3>惠青的服務成果</h3><p class="gallery-intro">地方建設、教育與親子活動，透過一張張圖卡記錄服務足跡。</p><section class="highlights" aria-label="三項重點政績"><article class="highlight"><span class="highlight-icon" aria-hidden="true">🛣️</span><h4>道路改善</h4><p>爭取經費約</p><p class="amount"><strong>4,397</strong> 萬元</p></article><article class="highlight"><span class="highlight-icon" aria-hidden="true">👵👴</span><h4>敬老加碼</h4><p>爭取禮金提高至</p><p class="amount"><strong>1,000</strong> 元</p></article><article class="highlight"><span class="highlight-icon" aria-hidden="true">🥛</span><h4>幼兒照顧</h4><p>爭取鄉立幼兒園<br>免費牛乳加碼為</p><p class="amount">每週 <strong>2</strong> 次</p></article></section><div class="achievement-grid"><a class="achievement-link" href="assets/achievements/achievement-01.webp" target="_blank" rel="noopener" aria-label="開啟第 1 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-01.webp" alt="服務成果圖卡 1" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-02.webp" target="_blank" rel="noopener" aria-label="開啟第 2 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-02.webp" alt="服務成果圖卡 2" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-03.webp" target="_blank" rel="noopener" aria-label="開啟第 3 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-03.webp" alt="服務成果圖卡 3" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-04.webp" target="_blank" rel="noopener" aria-label="開啟第 4 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-04.webp" alt="服務成果圖卡 4" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-05.webp" target="_blank" rel="noopener" aria-label="開啟第 5 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-05.webp" alt="服務成果圖卡 5" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-06.webp" target="_blank" rel="noopener" aria-label="開啟第 6 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-06.webp" alt="服務成果圖卡 6" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-07.webp" target="_blank" rel="noopener" aria-label="開啟第 7 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-07.webp" alt="服務成果圖卡 7" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-08.webp" target="_blank" rel="noopener" aria-label="開啟第 8 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-08.webp" alt="服務成果圖卡 8" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-09.webp" target="_blank" rel="noopener" aria-label="開啟第 9 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-09.webp" alt="服務成果圖卡 9" width="540" height="540"></a><a class="achievement-link" href="assets/achievements/achievement-10.webp" target="_blank" rel="noopener" aria-label="開啟第 10 張服務成果大圖"><img loading="lazy" src="assets/achievements/achievement-10.webp" alt="服務成果圖卡 10" width="540" height="540"></a><a class="achievement-link" href tle:'📞 聯絡我',html:`<h3>有需要，歡迎聯絡惠青</h3><p>地方建設建議、民眾服務及活動合作，都歡迎透過正式聯絡管道反映。</p><p>Facebook 粉絲專頁、LINE 與服務電話將在取得正確資訊後加入。</p><p class="note">目前為網站測試版，尚未開放線上留言或蒐集個人資料。</p>`}};
const overlay=document.getElementById('overlay'),modal=document.querySelector('.modal'),title=document.getElementById('modal-title'),body=document.getElementById('modal-body');let lastFocus=null;
function openPage(page){if(page==='home'){closePage();scrollTo({top:0,behavior:'smooth'});return}const data=pages[page];if(!data)return;lastFocus=document.activeElement;title.textContent=data.title;body.innerHTML=data.html;modal.classList.toggle('profile-mode',page==='about');const closeBtn=document.getElementById('close');closeBtn.classList.toggle('profile-close',page==='about');if(page==='about'){body.append(closeBtn);closeBtn.textContent='← 返回首頁'}else{document.querySelector('.modal-head').append(closeBtn);closeBtn.textContent='✕'}overlay.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus();document.getElementById('mobile-nav').hidden=true;document.getElementById('menu').setAttribute('aria-expanded','false')}
function closePage(){overlay.hidden=true;document.body.style.overflow='';lastFocus?.focus()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('close').addEventListener('click',closePage);overlay.addEventListener('click',e=>{if(e.target===overlay)closePage()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closePage()});document.getElementById('menu').addEventListener('click',()=>{const nav=document.getElementById('mobile-nav');nav.hidden=!nav.hidden;document.getElementById('menu').setAttribute('aria-expanded',String(!nav.hidden))});document.getElementById('dog').addEventListener('click',()=>{const tip=document.getElementById('dog-tip');tip.hidden=!tip.hidden});
